<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f7a"><title>Финансовое право</title><style>
:root{--a:#173f7a;--bg:#f4f6f8;--m:#6b7280;--l:#e5e7eb}*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:#111827;line-height:1.45}header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--l);padding:12px 16px;z-index:5}header b{font-size:18px}main{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin:0 0 12px}h2{margin:0 0 10px;font-size:20px}h3{font-size:16px}.muted{color:var(--m)}button{width:100%;border:0;border-radius:10px;padding:12px;background:var(--a);color:#fff;font-weight:700}.alt{background:#eef2ff;color:#1e3a8a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.hidden{display:none!important}.topic{display:flex;text-align:left;gap:10px;margin:8px 0;background:#fff;color:#111;border:1px solid var(--l)}.num{display:inline-grid;place-items:center;background:var(--a);color:#fff;border-radius:50%;width:32px;height:32px;flex:none}.task{background:#f8fafc;border-left:4px solid var(--a);padding:10px;border-radius:8px}.pill{display:inline-block;background:#eef2ff;color:#1e3a8a;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700}label{display:block;border:1px solid var(--l);border-radius:9px;padding:8px;margin:6px 0}textarea,input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{border:1px solid var(--l);padding:4px}footer{text-align:center;color:var(--m);padding:24px}@media(min-width:650px){.grid.five{grid-template-columns:repeat(5,1fr)}}
a.seminar-link{padding:12px;border-radius:10px;text-decoration:none;font-weight:700}.seminar-link:hover{border-color:var(--a);background:#eef2ff}button,a,input,textarea{font-family:inherit;font-size:inherit}input[type=radio]{width:auto}button:not(:disabled),a{cursor:pointer}:focus-visible{outline:3px solid #a97817;outline-offset:3px}.topic:disabled{opacity:.65;cursor:not-allowed}.journal-scroll{overflow-x:auto}.journal-scroll table{min-width:540px}
</style></head><body>
<header><b>Финансовое право</b><div class="muted">Мобильный практикум · 4 учебные группы</div></header><main>
<section id="group"><div class="card"><span class="pill">Шаг 1</span><h2>Выберите учебную группу</h2><div class="grid"><button class="alt" onclick="pickGroup(1)">Группа 1</button><button class="alt" onclick="pickGroup(2)">Группа 2</button><button class="alt" onclick="pickGroup(3)">Группа 3</button><button class="alt" onclick="pickGroup(4)">Группа 4</button></div></div></section>
<section id="home" class="hidden"><div class="card"><h2>Темы курса</h2><div id="badge" class="pill"></div><button class="alt" style="margin-top:9px" onclick="changeGroup()">Изменить группу</button></div><div id="topics" class="card"></div><div class="card"><button class="alt" onclick="teacherGate()">Вход преподавателя</button></div></section>
<section id="seminar" class="hidden"></section>
<section id="teacher" class="hidden"><div class="card"><h2>Панель преподавателя</h2><div class="grid"><button class="alt" onclick="tg(1)">Группа 1</button><button class="alt" onclick="tg(2)">Группа 2</button><button class="alt" onclick="tg(3)">Группа 3</button><button class="alt" onclick="tg(4)">Группа 4</button></div><p id="tgtitle" class="muted"></p><div class="journal-scroll" role="region" aria-label="Журнал группы" tabindex="0"><table><thead><tr><th>ФИО</th><th>Ком.</th><th>Сем.</th><th>Практ.</th><th>Докл.</th></tr></thead><tbody id="journal"></tbody></table></div><button style="margin-top:9px" onclick="saveJ()">Сохранить</button><button class="alt" style="margin-top:7px" onclick="leaveTeacher()">Выйти</button></div></section>
</main><footer>Финансовое право · 2026</footer>
<script>
const PIN='5837';
const S=[
{n:1,t:'Финансы и финансовая система',warm:['Гражданин получил зарплату.','Организация уплатила налог на прибыль.','Гражданин дал другу 50 000 руб. взаймы.','Казначейство перечислило бюджетному учреждению средства.','Покупатель оплатил продукты.','Государство разместило ОФЗ.','ГУП перечислил часть прибыли собственнику.','Родители дали студенту деньги.'],main:'Всякое ли движение денег является финансами?',teams:[['Что такое финансы?','Дайте определение; назовите 3 признака; приведите пример.'],['Функции финансов','Назовите функции и по одному примеру.'],['Публичные и частные финансы','Разграничьте и приведите примеры.'],['Централизованные и децентрализованные','Сравните по субъекту, цели и фондам.'],['Финансовая система РФ','Постройте схему и объясните критерий.']],practice:['Постройте схему финансовой системы РФ.','Определите место федерального, регионального и местного бюджетов.','Определите место финансов ГУП, банка, ООО и гражданина.'],case:'Иванов купил автомобиль; ООО уплатило налог; субъект получил субсидию; муниципалитет получил субвенцию; Иванов дал брату деньги в долг. Какие отношения являются финансовыми и какие относятся к финансовому праву?',quiz:[['Всякое движение денег является финансовым отношением?','Нет'],['Федеральный бюджет относится к публичным финансам?','Да'],['Финансы ГУП автоматически входят в бюджетную систему?','Нет']],reports:['История финансовой деятельности государства.','Правовые и неправовые формы финансовой деятельности.','Методы финансовой деятельности.','Минфин России.','Федеральное казначейство.']},
{n:2,t:'Финансовая деятельность государства и муниципальных образований',warm:['Госдума принимает закон о федеральном бюджете.','ФНС взыскивает недоимку.','Муниципалитет заключает договор на ремонт здания администрации.','Казначейство осуществляет кассовое обслуживание бюджета.','Правительство утверждает правила предоставления субсидии.','Муниципалитет проводит праздник.','Банк России устанавливает ключевую ставку.','Минфин готовит проект акта по бюджетной политике.'],main:'Какой признак отличает финансовую деятельность от любого другого публичного управления?',teams:[['Понятие','Определите финансовую деятельность; назовите 4 признака.'],['Формы','Разграничьте правовые и неправовые формы; по 3 примера.'],['Методы','Методы мобилизации, распределения и использования средств.'],['Компетенция','РФ, субъект, муниципалитет: по 3 полномочия.'],['Органы','Общая и специальная компетенция: Правительство, Минфин, Казначейство, ФНС, Банк России.']],practice:['Схема разграничения предметов ведения РФ → субъект → муниципалитет.','Соотношение правовых и неправовых форм.','Схема «направления → методы».','Взаимодействие Президента РФ, Правительства РФ и Банка России.'],case:'Муниципальный совет решил установить новый обязательный платеж, получить бюджетный кредит, предусмотреть субсидии учреждениям и подготовить изменения в местный бюджет. Где возникает вопрос компетенции, какая форма и какой метод используются?',quiz:[['Финансовая деятельность связана с публичными денежными фондами?','Да'],['Нормативный акт — правовая форма?','Да'],['Уплата налога — обязательная мобилизация средств?','Да'],['Казначейство — орган специальной компетенции?','Да']],reports:['Понятие, цели и задачи финансового контроля.','Принципы финансового контроля.','Предварительный, текущий и последующий контроль.','Счетная палата РФ.','Федеральное казначейство.','Росфинмониторинг.','Аудиторский контроль.']},
{n:3,t:'Финансовый контроль',warm:['Счетная палата проверяет исполнение федерального бюджета.','Казначейство проверяет условия бюджетной субсидии.','Банк проводит внутреннюю проверку кассира.','Росфинмониторинг анализирует подозрительные операции.','ФНС проводит камеральную проверку.','Аудитор выражает мнение о финансовой отчетности.','Муниципальный КСО проверяет местный бюджет.','Руководитель фирмы проверяет план продаж.'],main:'Какие признаки отличают финансовый контроль от любого другого контроля?',teams:[['Понятие и задачи','Дайте определение; назовите не менее 4 задач; отличите от общего контроля.'],['Принципы','Назовите принципы; 3 покажите на практике.'],['Виды','Разграничьте предварительный, текущий и последующий контроль.'],['Органы','Счетная палата, Казначейство, муниципальный КСО: место и полномочия.'],['Аудит и мониторинг','Сопоставьте государственный контроль, аудит и Росфинмониторинг.']],practice:['Счетная палата: функции → полномочия → объекты → результат.','Росфинмониторинг: задачи → информация → анализ → реагирование.','Сравните государственный контроль / аудит / финансовый мониторинг.','Покажите три стадии контроля на примере бюджетной субсидии.'],case:'Учреждение получило субсидию. До договора проверили лимиты; при исполнении Казначейство приостановило платеж; после года КСО выявил нецелевое использование; аудитор указал на искажение отчетности. Определите виды контроля, субъектов и возможные последствия.',quiz:[['Предварительный контроль проводится до операции?','Да'],['Счетная палата — внешний государственный аудит (контроль)?','Да'],['Аудиторское заключение заменяет государственную проверку?','Нет'],['Росфинмониторинг связан с ПОД/ФТ?','Да']],reports:['История финансового права.','Понятие и предмет финансового права.','Метод финансово-правового регулирования.','Финансовое право в системе российского права.','Система финансового права.','Принципы финансового права.','Наука финансового права.','Институты финансового права.','Финансово-контрольное право.','Источники финансового права.']}
];
let group=+(localStorage.finlaw_group||0),team=0,tgroup=+(localStorage.finlaw_teacher_group||1);
const $=id=>document.getElementById(id);
function pickGroup(n){group=n;localStorage.finlaw_group=n;$('group').classList.add('hidden');$('home').classList.remove('hidden');renderHome()}
function changeGroup(){$('home').classList.add('hidden');$('group').classList.remove('hidden')}
function renderHome(){
$('badge').textContent='Учебная группа '+group;
const future=['Финансовое право как отрасль','Ответственность за налоговые правонарушения. Защита прав налогоплательщиков','Бюджетная система','Бюджетный процесс','Государственный кредит','Обязательное социальное страхование','Денежная система','Валютное регулирование','Банковская система','Национальная платежная система','Финансовый рынок'];
$('topics').innerHTML=S.map(s=>`<button class="topic" onclick="openS(${s.n})"><span class="num">${s.n}</span><span><b>${s.t}</b><br><span class="muted">Материалы готовы</span></span></button>`).join('')+future.map((title,i)=>i===1?`<a class="topic seminar-link" href="seminar-5.html?group=${group}"><span class="num">5</span><span><b>${title}</b><br><span class="muted">Материалы готовы · 90 минут · 9 ситуаций</span></span></a>`:`<button class="topic" disabled><span class="num">${i+4}</span><span><b>${title}</b><br><span class="muted">Материалы пока не размещены</span></span></button>`).join('')
}
function openS(n){team=0;const s=S[n-1];$('home').classList.add('hidden');$('seminar').classList.remove('hidden');$('seminar').innerHTML=`<button class="alt" onclick="back()">← Все темы</button><div class="card"><span class="pill">Семинар ${s.n}</span><h2>${s.t}</h2><div class="muted">Учебная группа ${group}</div></div><div class="card"><h2>1. Разминка</h2><ol>${s.warm.map(x=>`<li>${x}</li>`).join('')}</ol><div class="task"><b>Главный вопрос:</b> ${s.main}</div></div><div class="card"><h2>2. Задание команды</h2><div class="grid five">${s.teams.map((x,i)=>`<button class="alt" onclick="showT(${s.n},${i})">Команда ${i+1}</button>`).join('')}</div><div id="teamBox" class="task" style="margin-top:9px">Выберите команду</div><textarea id="draft" rows="5" placeholder="Черновик команды"></textarea><button style="margin-top:8px" onclick="saveDraft(${s.n})">Сохранить черновик</button></div><div class="card"><h2>3. Практикум</h2><ol>${s.practice.map(x=>`<li>${x}</li>`).join('')}</ol></div><div class="card"><h2>4. Мини-кейс</h2><p>${s.case}</p></div><div class="card"><h2>5. Итоговый тест</h2><input id="studentName" placeholder="Фамилия и имя">${s.quiz.map((q,i)=>`<p><b>${i+1}. ${q[0]}</b></p><label><input type="radio" name="q${i}" value="Да"> Да</label><label><input type="radio" name="q${i}" value="Нет"> Нет</label>`).join('')}<button onclick="grade(${s.n})">Проверить</button><p id="result"></p></div><div class="card"><h2>6. Доклады на следующий семинар</h2><ol>${s.reports.map(x=>`<li>${x}</li>`).join('')}</ol><div class="task">До 5 минут, до 5 слайдов, последний слайд — практический вопрос группе.</div></div>`}
function back(){$('seminar').classList.add('hidden');$('home').classList.remove('hidden');renderHome()}
function showT(sn,i){team=i+1;const x=S[sn-1].teams[i];$('teamBox').innerHTML='<h3>'+x[0]+'</h3><p>'+x[1]+'</p>';$('draft').value=localStorage.getItem(`fl_${group}_${sn}_${team}`)||''}
function saveDraft(sn){if(!team)return alert('Сначала выберите команду');localStorage.setItem(`fl_${group}_${sn}_${team}`,$('draft').value);alert('Сохранено')}
function grade(sn){const s=S[sn-1];let score=0;s.quiz.forEach((q,i)=>{let e=document.querySelector(`input[name=q${i}]:checked`);if(e&&e.value===q[1])score++});$('result').textContent=($('studentName').value?$('studentName').value+': ':'')+score+' из '+s.quiz.length}
function teacherGate(){const p=prompt('PIN преподавателя');if(p===PIN){$('home').classList.add('hidden');$('teacher').classList.remove('hidden');tg(tgroup)}else if(p!==null)alert('Неверный PIN')}
function leaveTeacher(){$('teacher').classList.add('hidden');$('home').classList.remove('hidden')}
function tg(n){tgroup=n;localStorage.finlaw_teacher_group=n;$('tgtitle').textContent='Группа '+n;renderJ()}
function renderJ(){let a=[];for(let i=1;i<=30;i++)a.push(`<tr><td><input data-k="n${i}" placeholder="${i}. ФИО"></td><td><input data-k="c${i}"></td><td><input data-k="s${i}"></td><td><input data-k="p${i}"></td><td><input data-k="d${i}"></td></tr>`);$('journal').innerHTML=a.join('');document.querySelectorAll('#journal [data-k]').forEach(e=>e.value=localStorage.getItem(`tj_${tgroup}_${e.dataset.k}`)||'')}
function saveJ(){document.querySelectorAll('#journal [data-k]').forEach(e=>localStorage.setItem(`tj_${tgroup}_${e.dataset.k}`,e.value));alert('Группа сохранена')}
if(group){$('group').classList.add('hidden');$('home').classList.remove('hidden');renderHome()}
</script></body></html>
