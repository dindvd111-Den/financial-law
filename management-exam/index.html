<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Дистанционный зачёт по менеджменту. Выберите свободный билет и скачайте бланк ответов.">
  <title>Менеджмент — выбор билета на зачёт</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    iframe { display: block; }
  </style>
</head>
<body>
  <iframe id="exam" title="Менеджмент — выбор билета на зачёт" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-write"></iframe>
  <noscript><style>#exam { display: none; }</style>Для выбора билета включите JavaScript.</noscript>
  <script>
    const exam = document.getElementById('exam');
    const examOrigin = 'https://management-exam-rgup.dindvd111.chatgpt.site';
    function loadExam() {
      const ticket = /^#ticket=(?:[1-9]|1\d|2[0-5])$/.test(location.hash) ? location.hash : '';
      exam.src = examOrigin + '/' + ticket;
    }
    window.addEventListener('message', event => {
      if (event.origin !== examOrigin || event.source !== exam.contentWindow) return;
      if (event.data?.type === 'exam-ticket') {
        const number = event.data.number;
        if (Number.isInteger(number) && number >= 1 && number <= 25) {
          history.replaceState(null, '', '#ticket=' + number);
        }
      }
      if (event.data?.type === 'exam-request-receipt') {
        let receipt = null;
        try {
          const key = 'management-exam-receipt';
          receipt = localStorage.getItem(key) || crypto.randomUUID();
          localStorage.setItem(key, receipt);
        } catch { receipt = null; }
        exam.contentWindow.postMessage({type: 'exam-receipt', receipt}, examOrigin);
      }
    });
    window.addEventListener('hashchange', loadExam);
    loadExam();
  </script>
</body>
</html>
